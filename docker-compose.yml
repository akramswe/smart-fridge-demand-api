services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfridge
      POSTGRES_USER: smartfridge
      POSTGRES_PASSWORD: smartfridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfridge -d smartfridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartfridge:smartfridge@db:5432/smartfridge
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
